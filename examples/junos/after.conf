    family inet {
        filter PROTECT-RE {
            term ALLOW-SSH {
                from {
                    source-prefix-list {
                        MGMT-NETS;
                    }
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }
            term ALLOW-OSPF {
                from {
                    protocol ospf;
                }
                then accept;
            }
            term ALLOW-ICMP {
                from {
                    protocol icmp;
                }
                then accept;
            }
            term DENY-ALL {
                then {
                    count re-denied;
                    discard;
                }
