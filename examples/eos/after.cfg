! boot system flash:/EOS-4.31.2F.swi
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf1a
ip name-server vrf MGMT 10.10.10.53
dns domain corp.example.net
!
spanning-tree mode mstp
!
aaa authorization exec default local
!
username admin privilege 15 role network-admin secret sha512 $6$kQx8pZ2v$Gm7Hn3Jk9Lp1Qr5St7Uv9Wx1Yz3Ab5Cd7Ef9Gh1Ij3Kl5Mn7Op9Qr1St3Uv5Wx7Yz9
